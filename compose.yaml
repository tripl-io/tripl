# Production / deployment stack — runs the PUBLISHED release image.
#
#   docker compose pull && docker compose up -d
#
# `tripl install` writes this exact file (minus the `mcp` service's build block,
# which needs a source tree) into the directory it provisions, alongside
# infra/rabbitmq/rabbitmq.conf and a generated .env; `tripl upgrade --to X.Y.Z`
# moves the TRIPL_VERSION pin. The packaged copy lives at
# cli/src/tripl_cli/install/files/compose.yaml and a contract test asserts it is
# byte-identical to this one, so edit here and re-copy.
#
# ONE `app` container serves the JSON API *and* the built SPA on a single port
# (FastAPI app.frontend()), so there is NO separate frontend/nginx container.
# The same image runs the API, the one-shot migrate, and the Celery worker/beat
# — only the command differs.
#
# The image and tag are configurable via .env:
#   TRIPL_IMAGE    (default ghcr.io/tripl-io/tripl)
#   TRIPL_VERSION  (default latest — pin to a released tag e.g. 1.4.0 in prod)
#
# Required secrets in .env (generate them — see website/docs/run/deployment.md):
#   POSTGRES_PASSWORD, RABBITMQ_PASSWORD, ENCRYPTION_KEY, SECRET_KEY, APP_BASE_URL
#
# Build & publish a new image with `bin/release.sh` (see website/docs/run/release.md).
# For local development with hot-reload, use compose.dev.yaml instead:
#   docker compose -f compose.dev.yaml up --watch
#
# Schema upgrades run once via the `migrate` one-shot before app/workers start,
# so a multi-worker deploy never races the upgrade.
x-app-image: &app-image "${TRIPL_IMAGE:-ghcr.io/tripl-io/tripl}:${TRIPL_VERSION:-latest}"

x-app-environment: &app-environment
  # Credentials come from .env and MUST NOT be the dev defaults: the app's
  # assert_production_ready() refuses URLs containing tripl:tripl / guest:guest
  # when DEBUG is off (the prod default). Generate them — see website/docs/run/deployment.md.
  DATABASE_URL: postgresql+asyncpg://tripl:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tripl
  SYNC_DATABASE_URL: postgresql+psycopg://tripl:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/tripl
  RABBITMQ_URL: amqp://tripl:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672//
  REDIS_URL: redis://redis:6379/0
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL e.g. https://tripl.example.com}
  # The prod stack assumes TLS in front of :8000, so secure cookies stay on.
  # To preview over plain HTTP locally, use compose.dev.yaml instead.
  SESSION_COOKIE_SECURE: "true"
  SECURITY_HEADERS_ENABLED: "true"
  HSTS_ENABLED: ${HSTS_ENABLED:-true}
  RATE_LIMIT_ENABLED: "true"
  # SERVE_FRONTEND/FRONTEND_DIST_DIR are baked into the image. The app is the
  # edge here, so rate_limit_trust_forwarded_for stays at its False default —
  # set it (and uvicorn --forwarded-allow-ips) true only behind a trusted proxy.
  LOG_JSON: ${LOG_JSON:-true}
  # Demo kill switches. Without these two lines a value set in .env never reaches
  # the container, so the documented rollback switch does nothing.
  # DEMO_ENABLED gates demo provisioning (create + reset); DEMO_RUNTIME_ENABLED
  # gates the background tick that keeps a demo fresh. Neither touches real
  # projects.
  DEMO_ENABLED: ${DEMO_ENABLED:-true}
  DEMO_RUNTIME_ENABLED: ${DEMO_RUNTIME_ENABLED:-true}
  # Demos kept seeded ahead of time and handed out at once (0 = off).
  DEMO_POOL_SIZE: ${DEMO_POOL_SIZE:-0}
  DEMO_POOL_MAX_AGE_HOURS: ${DEMO_POOL_MAX_AGE_HOURS:-20}
  # Everything below is documented in website/docs/run/configuration.md as an
  # environment variable, so it has to actually reach the container. The same
  # omission is what made the DEMO_ENABLED switch inert and then
  # REGISTRATION_MODE — whose whole purpose is closing self-service signup on a
  # public instance.
  #
  # `${VAR:-}` materialises an UNSET variable as the empty STRING in the
  # container, not as an absent one. Falling through to the application default
  # is therefore not free: it works because Settings sets
  # `env_ignore_empty=True` (backend/src/tripl/config.py). Without that flag the
  # typed members of this list ("" parsed as a bool/int/enum) crash
  # `Settings()` at import and every container exits on boot.
  REGISTRATION_MODE: ${REGISTRATION_MODE:-}
  # Organizations (F20). DEPLOYMENT_MODE and PLATFORM_ADMIN_EMAILS are read by
  # the `migrate` one-shot too: the organization migration uses them to decide
  # who becomes a platform admin. ORG_SETTINGS_OPERATOR_FALLBACK is stored for a
  # later release and changes nothing yet.
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  ORG_SETTINGS_OPERATOR_FALLBACK: ${ORG_SETTINGS_OPERATOR_FALLBACK:-}
  # Outbound requests to public addresses only (always on with DEPLOYMENT_MODE=hosted).
  OUTBOUND_PUBLIC_HOSTS_ONLY: ${OUTBOUND_PUBLIC_HOSTS_ONLY:-}
  # Sign in with Google and a public demo instance (website/docs/run/public-demo.md).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-}
  OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
  OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
  OIDC_AUTO_CREATE_USERS: ${OIDC_AUTO_CREATE_USERS:-}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-}
  TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-}
  PUBLIC_DEMO: ${PUBLIC_DEMO:-}
  # The Enterprise license key (read by the Enterprise image only).
  LICENSE_KEY: ${LICENSE_KEY:-}
  IDLE_ORG_RETENTION_DAYS: ${IDLE_ORG_RETENTION_DAYS:-}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
  CONTENT_SECURITY_POLICY: ${CONTENT_SECURITY_POLICY:-}
  MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-}
  HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-}
  RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-}
  RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-}
  # Only meaningful behind a trusted proxy — see the note above about the app
  # being the edge by default.
  RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
  PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-}
  PROMETHEUS_MULTIPROC_DIR: /app/var/prometheus
  SCAN_JOB_RETENTION_DAYS: ${SCAN_JOB_RETENTION_DAYS:-90}
  DISTRIBUTION_DRIFT_RETENTION_DAYS: ${DISTRIBUTION_DRIFT_RETENTION_DAYS:-90}
  DISTRIBUTION_DRIFT_MINOR_RETENTION_DAYS: ${DISTRIBUTION_DRIFT_MINOR_RETENTION_DAYS:-30}
  PHOTO_ORPHAN_SWEEP_GRACE_HOURS: ${PHOTO_ORPHAN_SWEEP_GRACE_HOURS:-24}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
  LOG_LEVEL: ${LOG_LEVEL:-}
  REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-}
  AI_ENABLED: ${AI_ENABLED:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  SEARCH_EMBEDDINGS_ENABLED: ${SEARCH_EMBEDDINGS_ENABLED:-}
  SEARCH_EMBEDDING_PROVIDER: ${SEARCH_EMBEDDING_PROVIDER:-}
  SEARCH_EMBEDDING_MODEL: ${SEARCH_EMBEDDING_MODEL:-}
  SEARCH_EMBEDDING_DIMENSIONS: ${SEARCH_EMBEDDING_DIMENSIONS:-}
  SEARCH_EMBEDDING_API_KEY: ${SEARCH_EMBEDDING_API_KEY:-}
  # Not a tuning knob: this line is the whole of the documented "keep indexed
  # text on your own endpoint" control, and without it the app falls back to
  # api.openai.com whatever .env says. Changing it — or
  # DIMENSIONS — after documents are indexed requires a re-index, since vectors
  # from two embedding spaces are not comparable.
  SEARCH_EMBEDDING_BASE_URL: ${SEARCH_EMBEDDING_BASE_URL:-}

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_USER: tripl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tripl
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripl"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: tripl
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      # As the rabbitmq user: run as root, a probe that fires before the server
      # has written its Erlang cookie writes a root-owned one, and the server then
      # dies with eacces reading it.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    restart: unless-stopped
    image: redis:8.8.3-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot schema upgrade; app + workers wait for it to complete.
  migrate:
    image: *app-image
    # The core's migrations (alembic upgrade head), then each installed
    # extension's (tripl.migrate).
    command: ["python", "-m", "tripl.migrate"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  # Clear stale Prometheus worker shards once, before any instrumented process
  # starts. All API/worker/beat processes share this directory.
  metrics-init:
    image: *app-image
    command: ["sh", "-c", "find /app/var/prometheus -maxdepth 1 -type f -name '*.db' -delete"]
    volumes:
      - prometheus-multiproc:/app/var/prometheus

  # The ONE app container: JSON API + built SPA on a single port.
  app:
    restart: unless-stopped
    image: *app-image
    environment: *app-environment
    ports:
      - "8000:8000"
    # Uploaded event photos: the local photo backend's default root
    # (./var/photos under the image's WORKDIR /app). Without a volume, every
    # redeploy recreates the container and discards the files while their
    # rows stay in Postgres. The image creates this
    # directory owned by the app user, and a new named volume starts out with
    # that ownership. Back it up together with pgdata18.
    volumes:
      - photos:/app/var/photos
      - prometheus-multiproc:/app/var/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      metrics-init:
        condition: service_completed_successfully

  celery-worker:
    restart: unless-stopped
    image: *app-image
    command: ["celery", "-A", "tripl.worker.celery_app", "worker", "--loglevel=info"]
    environment: *app-environment
    # The same photos volume as app: the daily orphan-photo sweep runs here and
    # lists the local backend's files. Without it the sweep
    # sees an empty directory and does nothing.
    volumes:
      - photos:/app/var/photos
      - prometheus-multiproc:/app/var/prometheus
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      metrics-init:
        condition: service_completed_successfully

  celery-beat:
    restart: unless-stopped
    image: *app-image
    command: ["celery", "-A", "tripl.worker.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    environment: *app-environment
    volumes:
      - prometheus-multiproc:/app/var/prometheus
    healthcheck:
      disable: true
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      metrics-init:
        condition: service_completed_successfully

  # OPTIONAL MCP server for agent runtimes — profile-gated, never starts by
  # default. Streamable-HTTP transport with per-request Authorization
  # pass-through (keys are never stored server-side); see
  # website/docs/integrate/mcp-server.md. Enable with:
  #   docker compose --profile mcp up -d
  # Uses the published MCP image when available (TRIPL_MCP_IMAGE); from a source
  # checkout, `docker compose --profile mcp build mcp` builds mcp-server/.
  mcp:
    restart: unless-stopped
    image: "${TRIPL_MCP_IMAGE:-ghcr.io/tripl-io/tripl-mcp}:${TRIPL_VERSION:-latest}"
    # Context is the repo root, not ./mcp-server: tripl-mcp builds against the
    # sibling `tripl` package in ./cli, which a mcp-server/ context cannot see.
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    # The image ENTRYPOINT is already `tripl-mcp`, so command holds flags only.
    # --host 0.0.0.0 is required for the published port to be reachable.
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8765"]
    # A TCP connect, not an HTTP GET: the MCP SDK's /mcp endpoint rejects a bare GET,
    # so an HTTP probe would report a healthy server as unhealthy. Without this
    # the sidecar could only be depended on with service_started, which says
    # nothing about whether it is listening.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    profiles: [mcp]
    ports:
      # Bound to the host loopback on purpose: this proxy forwards write-capable
      # tk_w_ keys verbatim and has no auth of its own. Put it behind the same
      # reverse proxy / trusted network as the app before widening this bind.
      - "127.0.0.1:8765:8765"
    environment:
      TRIPL_BASE_URL: http://app:8000
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata18:
  photos:
  prometheus-multiproc:
