[project]
name = "tripl-mcp"
# 0.2.2: new Docs-note and typed-property tools, which import modules only
# `tripl` 0.2.2 has; the dependency floor below moved with it. The version
# range that dependency pins is declared once, below; it is not repeated here.
version = "0.2.2"
description = "Standalone MCP server exposing a curated agent toolset over the tripl REST API"
readme = "README.md"
requires-python = ">=3.12"
# Apache-2.0 while the SERVICE is AGPL-3.0-or-later, and that split is
# deliberate: this package is a standalone httpx client of the REST API — it
# imports nothing from `tripl` — so a permissive licence lets anyone embed it in
# their own agent without the service's copyleft reaching into their codebase.
# Apache rather than MIT for the express patent grant.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vladislav Denisov" }]
keywords = ["mcp", "model-context-protocol", "analytics", "tracking-plan", "tripl"]
# Trove classifiers are what PyPI's sidebar and search filters read. No
# "Private :: Do Not Upload" here on purpose — this package IS meant to be
# installed by users (uvx tripl-mcp), unlike the service itself, which ships as
# a container image.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # Upper bound is load-bearing, not caution: this package imports
    # ``mcp.server.fastmcp``, which mcp 2.0 removed when it reorganised the
    # server API (2.0 ships mcp.server.mcpserver instead). uv.lock pins 1.28.1
    # so the repo and CI never see it, but a lockfile is not published — an
    # installer resolving ">=1.9.0" alone gets 2.0 and the console script dies
    # on import with ModuleNotFoundError. Caught by installing the built wheel
    # into a clean venv before the first PyPI upload.
    "mcp>=1.9.0,<2",
    # Upper bound for the same reason `mcp<2` carries one: a published wheel
    # ships constraints, not the lockfile, so an unbounded floor lets a
    # consumer resolve a future major that moved the API out from under us.
    "httpx>=0.27.0,<1",
    # The HTTP client lives in the `tripl` distribution and is IMPORTED from
    # there, not copied. Copying 179 lines would have been the
    # fourth instance of this repo's recurring drift defect — query keys drifted
    # four ways, the event-name regex three, plus security headers and the
    # signal significance gate.
    #
    # `>=0.2`, NOT `>=0.1`: this package imports `page_items` / `page_total`
    # from `tripl_cli.api`, and the published tripl 0.1.0 does not export them —
    # they were added after it shipped. A wheel declaring `>=0.1` therefore
    # resolves happily and then dies on import with ImportError, which is what
    # the clean-venv smoke test in publish-mcp.yml caught. Bump
    # this floor whenever a symbol is imported that an older `tripl` lacks.
    #
    # [tool.uv.sources] below points `tripl` at the sibling checkout for anything
    # that BUILDS from this source tree — see the note there, it is broader than
    # local development. uv strips that table from PUBLISHED metadata, so the
    # wheel carries this plain constraint alone (verified against the built
    # artifact, not assumed) and a consumer of the release resolves it from the
    # index.
    "tripl>=0.2.2,<0.3",
]

[project.urls]
Homepage = "https://tripl-io.github.io/tripl/"
Documentation = "https://tripl-io.github.io/tripl/integrate/mcp-server"
Repository = "https://github.com/tripl-io/tripl"
Issues = "https://github.com/tripl-io/tripl/issues"

[project.scripts]
tripl-mcp = "tripl_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "respx>=0.22",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.uv.sources]
# Resolve `tripl` from the sibling checkout rather than from the published
# release, so an edit in ../cli is picked up with no install step and both suites
# exercise the same source.
#
# NOT just development and CI — this applies to every install that BUILDS from
# this source tree. `uvx --from git+…#subdirectory=mcp-server` clones the WHOLE
# repository, so ../cli comes with it and uv resolves `tripl` from that path;
# uv's own resolution line says `tripl==… (from git+…#subdirectory=cli)`. That
# is a feature — the git form pins server and client to one commit and needs
# nothing from the index — but do not write that the git form fetches `tripl`
# from PyPI. The docs claimed exactly that and were wrong (PR #102).
#
# What uv DOES strip is this table from published metadata, so the wheel keeps
# the plain version constraint declared above and consumers of the PyPI release
# resolve `tripl` from the index. `../cli` is also the only thing named `tripl`
# in the repo now — backend/ used to declare that distribution name too and is
# `tripl-server` now.
tripl = { path = "../cli" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripl_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
