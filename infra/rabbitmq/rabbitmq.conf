# RabbitMQ broker configuration for tripl.
#
# consumer_timeout: how long the broker waits for an ack before it decides the
# consumer is stuck, force-closes the channel (PRECONDITION_FAILED) and requeues
# the delivery. The default for rabbitmq:4.3 is 1800000 ms (30 min).
#
# We run `collect_metrics` with task_acks_late=True (see
# backend/src/tripl/worker/celery_app.py), so a long metrics *replay* holds its
# delivery unacked for the whole run — and a full replay over a multi-day window
# legitimately takes ~hours (24+ hourly chunks, each its own warehouse query).
# With the 30-min default the broker kept requeuing the still-running task,
# spawning overlapping duplicate executions that fought over the same job's
# chunk progress (visible as progress jumping backwards, e.g. 19/24 -> 14/24)
# and never let the job reach a terminal, acked state — the replay looped forever.
#
# Set it strictly ABOVE the Celery hard task_time_limit for collect_metrics
# (COLLECT_METRICS_TIME_LIMIT_SECONDS = 25h = 90_000_000 ms) so Celery's own
# limit governs task termination (clean SIGKILL + task_reject_on_worker_lost
# requeue) instead of the broker silently force-requeuing a live task.
# 26h = 93_600_000 ms. Invariant guarded by test_metrics_tasks.py.
consumer_timeout = 93600000
