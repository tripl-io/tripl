[project]
name = "tripl"
# 0.2.3: the installer's compose file runs RabbitMQ's healthcheck as the
# rabbitmq user (gosu), so a first `tripl install` no longer races the Erlang
# cookie. Versioned with the service release; tripl-mcp is unchanged.
version = "0.3.0"
description = "Operator CLI for a tripl tracking-plan instance: diagnostics, health and live monitoring"
readme = "README.md"
requires-python = ">=3.12"
# Apache-2.0 while the SERVICE is AGPL-3.0-or-later, for the same reason
# tripl-mcp is: this distribution is a standalone httpx client of the REST API
# and imports nothing from the backend's `tripl` package, so a permissive
# licence keeps the service's copyleft out of anything embedding it. It is also
# load-bearing downstream — tripl-mcp DEPENDS on this distribution, so anything
# stricter here would reach straight through tripl-mcp's own Apache-2.0 promise.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vladislav Denisov" }]
keywords = ["tripl", "cli", "analytics", "tracking-plan", "observability", "devops"]
# Trove classifiers are what PyPI's sidebar and search filters read. No
# "Private :: Do Not Upload" here on purpose — this package IS meant to be
# installed by users (uvx tripl), unlike the service itself, which ships as a
# container image.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    # httpx alone, and that is a BUDGET rather than a starting point: tripl-mcp
    # imports its HTTP client from this distribution, so every
    # dependency added here is forced onto every MCP-server install too. Config
    # parsing uses stdlib tomllib and argument parsing stdlib argparse for
    # exactly that reason — no click, no rich, no tomli.
    # Upper bound for the same reason tripl-mcp bounds `mcp` below its next major: a published wheel
    # ships constraints, not the lockfile, so an unbounded floor lets a
    # consumer resolve a future major that moved the API out from under us.
    "httpx>=0.27.0,<1",
]

[project.urls]
Homepage = "https://docs.tripl.io/"
# The docs site sets `routeBasePath: '/'` under baseUrl `/tripl/`, so a page at
# website/docs/run/cli.md is served at /tripl/run/cli — there is no /docs/
# segment. mcp-server/pyproject.toml carried the /docs/ form and 404ed; both are
# corrected now, so check this shape when adding a third package.
Documentation = "https://docs.tripl.io/run/cli"
Repository = "https://github.com/tripl-io/tripl"
Issues = "https://github.com/tripl-io/tripl/issues"

[project.scripts]
# `main` returns an int rather than calling sys.exit itself: the generated
# console-script wrapper is `sys.exit(main())`, so the exit code still lands,
# and tests can assert on the return value without catching SystemExit.
tripl = "tripl_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # The client is async (it is shared with tripl-mcp, which needs it async),
    # so the moved client tests are coroutines even though the CLI surface is
    # synchronous.
    "pytest-asyncio>=0.26",
    "respx>=0.22",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The import package is tripl_cli, NOT tripl: the service's own source package
# is backend/src/tripl/, and a distribution installing an importable `tripl`
# would shadow it in any environment holding both — a contributor's backend
# venv, for one.
#
# No `artifacts` entry is needed for src/tripl_cli/install/files/*: hatchling
# copies a listed package wholesale, so compose.yaml and rabbitmq.conf ship as
# package data already. Verified against a built wheel rather than assumed —
# `uv build --wheel` then unzip, and both files are there. They
# are read through importlib.resources, which is why this matters at all.
# The same holds for src/tripl_cli/codegen/templates/*.mustache, the built-in
# `tripl codegen` templates (#262): package data by the same rule, read the same way.
packages = ["src/tripl_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# An un-awaited coroutine is a RuntimeWarning printed at garbage-collection time,
# which in a fan-out test reads as unrelated noise long after the bug. doctor
# builds its fan-outs from comprehensions over targets precisely so a coroutine
# is never reused or dropped; this makes the failure mode loud.
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# No ignore_missing_imports, unlike mcp-server: every runtime import here is
# stdlib or httpx, both of which ship type information. Keeping the flag would
# silently accept the first untyped dependency someone adds.
