minimumReleaseAgeExclude:
  - "@csstools/css-color-parser@4.1.4"
# CodeMirror extensions use identity checks from @codemirror/state. Keep the
# wrapper and language packages on one core graph to avoid cross-instance crashes.
overrides:
  "@codemirror/language": "6.12.4"
  "@codemirror/state": "6.7.1"
  "@codemirror/view": "6.43.6"
  # Highlighting and SQL parsing share NodeProp identities from @lezer/common.
  "@lezer/common": "1.5.3"
  # openapi-typescript reaches js-yaml through @redocly/openapi-core.
  "js-yaml": "^4.3.2"
  # undici reaches the tree only through the jsdom/Vitest test toolchain (not
  # shipped assets), but 7.27.2 carries three high advisories. Pin past them.
  "undici": "^7.28.0"
