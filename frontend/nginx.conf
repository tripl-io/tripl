# Main nginx config — replaces the upstream image's /etc/nginx/nginx.conf.
# We do this so we can `load_module` ngx_brotli at the top level (modules
# can't be loaded from conf.d, since those are included inside http{}).

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Brotli — serve precompressed .br files where present (built by
    # vite-plugin-compression2). brotli on/comp_level handle dynamic
    # content (proxied API responses, etc.); we keep it light at level 4.
    brotli_static on;
    brotli on;
    brotli_comp_level 4;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        application/wasm
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml;

    # gzip for clients that do not advertise brotli. Browsers only send
    # `Accept-Encoding: br` over HTTPS, so a plain-HTTP deployment used to get
    # every chunk uncompressed. gzip_static serves the .gz files the build
    # emits alongside the .br ones.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    server {
        listen 5173;
        resolver 127.0.0.11 valid=5s;

        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            set $backend http://api:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            # X-Real-IP is set (overwritten) by us on every request, so the
            # backend can trust it as the true client IP for rate limiting even
            # when rate_limit_trust_forwarded_for is enabled. We also forward
            # the standard XFF/proto headers; the backend keys on the leftmost
            # trusted value only.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Event photos may be up to photo_max_size_mb (10 MB, backend
            # config.py) plus multipart overhead; nginx's default is 1m, which
            # answered larger uploads with its own 413 page.
            client_max_body_size 12m;
        }

        # Long read URLs (the batch health read repeats `ids=` up to 150
        # times, about 6 KB) fit one default 8k buffer; 32k leaves headroom
        # over the default 414 limit for any GET that lists ids.
        large_client_header_buffers 4 32k;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            # Security headers for the SPA document. `always` so they apply to
            # error responses too. CSP is tuned for a Vite React SPA using
            # Radix/Tailwind/recharts/codemirror (inline styles required;
            # scripts are bundled and served from self) and must equal the
            # backend's default (middleware/security_headers.py) —
            # tests/cspContract.test.ts compares them, and Permissions-Policy
            # too. They live here, not on the server block: a location with
            # its own add_header (Cache-Control above) inherits none of them.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src https://www.figma.com https://embed.figma.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        location /assets/ {
            expires 1y;
            # A location with its own add_header inherits none from the server
            # or other locations, so the headers that matter for scripts and
            # styles are repeated here.
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
