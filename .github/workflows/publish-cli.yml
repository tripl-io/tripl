name: Publish tripl

# Publishes the operator CLI to PyPI as the `tripl` distribution.
#
# Three release trains, deliberately independent: release.yml ships the SERVICE
# as a container image on `v*`, publish-mcp.yml ships tripl-mcp on `mcp-v*`, and
# this one ships the CLI on `cli-v*`. They version separately (service 0.2.x,
# tripl-mcp 0.1.x, tripl 0.1.x), so one tag namespace per artifact is the only
# arrangement that does not force a version bump nobody asked for.
#
# ORDERING NOTE: publish-mcp.yml's clean-venv smoke test fails on purpose until
# this workflow has run at least once, because tripl-mcp declares
# `tripl>=0.1,<0.2` and a released wheel with an unresolvable dependency is
# broken for every installer. So `tripl` must reach the index before the next
# tripl-mcp release.
#
# Authentication is Trusted Publishing (OIDC) — there is no API token stored
# anywhere. PyPI verifies the workflow identity (repo + workflow file +
# environment) against a publisher configured on the project and mints a
# short-lived credential for that upload only. A leaked repo secret cannot
# publish, because there is no secret.
on:
  push:
    tags:
      - "cli-v*"

# Least privilege, matching publish-mcp.yml. `contents: read` is the documented
# minimum for actions/checkout; it is redundant on a public repo but is what
# keeps this working if the repo is ever made private. Deliberately NOT
# `actions: write`: upload-artifact@v4 writes through the Actions artifact
# service using ACTIONS_RUNTIME_TOKEN, which the runner injects independently of
# GITHUB_TOKEN, so no artifact scope is involved.
permissions:
  contents: read

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Repeated from ci.yml's `cli` job on purpose: a release must never be the
      # first time these run, and a tag can be pushed on a commit that never
      # went through CI. --locked, not --frozen: it FAILS
      # when uv.lock no longer describes pyproject.toml, whereas --frozen would
      # quietly gate on a dependency set the built wheel does not describe.
      - name: Lint, type-check and test
        working-directory: cli
        run: |
          uv run --locked --group dev ruff check
          uv run --locked --group dev ruff format --check
          uv run --locked --group dev mypy src
          uv run --locked --group dev pytest -q

      # A tag that disagrees with pyproject silently publishes the wrong version,
      # and a version number can never be reused on PyPI. Fail instead.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        working-directory: cli
        run: |
          packaged=$(uv version --short)
          tagged=${GITHUB_REF_NAME#cli-v}
          echo "packaged=$packaged tagged=$tagged"
          if [ "$packaged" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $packaged"
            exit 1
          fi

      - name: Build sdist and wheel
        working-directory: cli
        run: uv build

      # Installing the built wheel into a clean environment is the check that
      # catches what a lockfile hides: uv.lock pins a working dependency set, but
      # consumers get only the declared constraints. tripl-mcp learned this the
      # expensive way — an unbounded `mcp` floor resolved to 2.0, where
      # mcp.server.fastmcp no longer exists, and the console script died on
      # import. This package declares `httpx>=0.27.0,<1` for the same reason.
      - name: Smoke-test the wheel in a clean environment
        working-directory: cli
        run: |
          uv venv /tmp/smoke --python 3.12
          # Deliberately NO --find-links: this must install exactly what a user
          # gets from the index, dependencies included.
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/tripl --version
          /tmp/smoke/bin/tripl doctor --help
          # The import package is tripl_cli, NOT tripl: the service's own source
          # package is backend/src/tripl/, and a wheel installing an importable
          # `tripl` would shadow it in any environment holding both. This asserts
          # the wheel cannot do that, which no unit test can check.
          /tmp/smoke/bin/python -c "import tripl_cli"
          if /tmp/smoke/bin/python -c "import tripl" 2>/dev/null; then
            echo "::error::the wheel installs an importable 'tripl', which shadows the backend package"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: cli/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name is part of what PyPI verifies for a trusted publisher,
    # and it is where a manual approval gate can be added later.
    environment: pypi
    permissions:
      # Job-level permissions REPLACE the workflow-level block rather than
      # extending it, so contents is restated here even though this job only
      # downloads an artifact.
      contents: read
      id-token: write # mint the OIDC token PyPI exchanges for upload rights
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Named explicitly rather than left to the action's default, which is a
          # needless thing to gamble a publish on.
          repository-url: https://upload.pypi.org/legacy/
