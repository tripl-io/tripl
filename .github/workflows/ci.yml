name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Allow the release workflow to run CI as a gate before publishing an image.
  workflow_call:

# A new push to a pull request cancels that pull request's run in flight: only
# the newest head can merge, and every superseded run spends Actions minutes.
# main and the release gate get a group of their own per run, so they never
# cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # uv reads backend/.python-version itself during `uv sync`; setup-uv
          # has no `python-version-file` input (it warned "Unexpected input").

      - name: Install dependencies
        run: uv sync --extra dev

      # The formatting check is the authoritative gate: the pre-commit hook can be
      # skipped with --no-verify, CI cannot. Its absence here is exactly why the
      # tree drifted out of format, even though `make lint-be` and CONTRIBUTING
      # both already listed `ruff format --check` as a required check.
      # No path argument on purpose: scope comes from pyproject.toml, the same
      # way `make lint-be` resolves it. A hand-written `src/` here is how CI and
      # the Makefile drifted apart — CI passed while alembic/versions sat
      # unformatted, until someone formatted it explicitly and 12 migrations
      # rewrote in one PR.
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      # The conformance gates need real warehouses, and the relevance harness and
      # the digest concurrency gate each need a real PostgreSQL, so all three run
      # in their own jobs (below) rather than skipping noisily here.
      #
      # -n auto: pytest-xdist, one worker per runner core. Each worker is its own
      # process with its own in-memory SQLite database (the conftest engine is
      # per process), so tests stay isolated. worksteal rebalances the long demo
      # and anomaly tests that would otherwise pile up on one worker. The final
      # summary line still counts every selected test: compare it with
      # `pytest --collect-only -q` under the same -m expression.
      #
      # Coverage measures through sys.monitoring ([tool.coverage.run] core =
      # "sysmon"): under the C settrace tracer this step took ~22 minutes, under
      # sysmon ~8.5, with the same total.
      #
      # Coverage (pytest-cov, which combines the xdist workers' data): the floor
      # is [tool.coverage.report] fail_under in pyproject.toml, which pytest-cov
      # applies on its own, so no --cov-fail-under here to drift from it. It is
      # 0 until the first measured baseline is recorded, so for now it reports
      # and does not gate.
      - name: Pytest
        run: >-
          uv run pytest -q -n auto --dist worksteal --durations=30
          -m "not conformance and not relevance and not pg_concurrency"
          --cov=tripl --cov-report=term-missing:skip-covered

  # The two client packages. NEITHER used to run in PR CI —
  # mcp-server's suite executed only in publish-mcp.yml, at tag time, and cli/
  # did not exist. That was survivable while tripl-mcp was self-contained; it is
  # not now, because tripl-mcp imports its HTTP client FROM cli/, so a change
  # under cli/ can break the MCP server with nothing in PR CI to catch it.
  # Hence two jobs, not one: they must fail independently and name which side
  # broke. Same four commands as publish-mcp.yml's gate, deliberately.
  #
  # --locked, NOT --frozen. They are not synonyms: --frozen uses the lockfile
  # as-is and skips the consistency check entirely, so a pyproject that has moved
  # ahead of uv.lock sails through. --locked is the one that verifies the lock
  # still describes the pyproject and fails when it does not — which is the whole
  # point of running this in CI, and for mcp-server means catching a `tripl`
  # constraint that the lock has not caught up with.
  cli:
    name: CLI (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Ruff
        run: |
          uv run --locked --group dev ruff check
          uv run --locked --group dev ruff format --check

      - name: Mypy
        run: uv run --locked --group dev mypy src

      - name: Pytest
        run: uv run --locked --group dev pytest -q

      # The console script IS the deliverable, so prove it survives packaging —
      # running it out of the source tree proves nothing about the wheel. This
      # mirrors publish-mcp.yml's smoke test, and it is where a missing entry
      # point, an unbundled py.typed or a wrong module layout shows up.
      - name: Smoke-test the built wheel
        run: |
          uv build
          uv venv /tmp/cli-smoke --python 3.12
          uv pip install --python /tmp/cli-smoke/bin/python dist/*.whl
          /tmp/cli-smoke/bin/tripl --version

  mcp:
    name: MCP server (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Needs the whole repo checked out, not just this directory: uv resolves
        # `tripl` from ../cli via [tool.uv.sources], and test_contract.py reads
        # backend/openapi.json.
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Ruff
        run: |
          uv run --locked --group dev ruff check
          uv run --locked --group dev ruff format --check

      - name: Mypy
        run: uv run --locked --group dev mypy src

      - name: Pytest
        run: uv run --locked --group dev pytest -q

  conformance:
    # Executable warehouse gates. Every other adapter test asserts generated SQL
    # STRINGS against FAKE clients, and a fake client accepts any string — which is
    # how BigQuery shipped TIMESTAMP_BIN (not a GoogleSQL function) and a
    # GROUP BY <ARRAY> (rejected outright by GoogleSQL) with a green suite. This job
    # EXECUTES the SQL on PostgreSQL and ClickHouse, and ANALYZES it with the real
    # ZetaSQL analyzer that ships inside the credential-free BigQuery emulator.
    name: Warehouse conformance (postgres + clickhouse + BigQuery analyzer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Images are pinned by digest, not just tag: a gate whose warehouse can change
      # underneath it is not a gate. The digests are multi-arch indexes.
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: tripl
          POSTGRES_PASSWORD: tripl
          POSTGRES_DB: tripl_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripl -d tripl_conformance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      clickhouse:
        # No --health-cmd: the image's shell tooling is not something this gate should
        # depend on. The explicit wait step below polls /ping instead, which is both
        # more honest and easier to debug when it fails.
        image: clickhouse/clickhouse-server:26.8@sha256:9716a352d25f538bd19d868b001141e7a60e4d035bc9b823658c6a071660aa61
        ports:
          - 8123:8123
        env:
          # Required, not cosmetic: with neither CLICKHOUSE_USER nor
          # CLICKHOUSE_PASSWORD set, the image's entrypoint *disables network
          # access for the `default` user* ("disabling network access for user
          # 'default'"), so every connection is rejected with code 194. Give the
          # gate a real user, exactly as the postgres service above does.
          CLICKHOUSE_USER: tripl
          CLICKHOUSE_PASSWORD: tripl
          CLICKHOUSE_DB: tripl_conformance
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start the BigQuery emulator
        # A service container needs a health check to be useful, and this image has
        # no health tooling — so it is started here and polled below. It needs NO GCP
        # credentials: it embeds Google's real ZetaSQL analyzer, which is what makes
        # it authoritative on whether the generated GoogleSQL is VALID.
        run: |
          docker run -d --name bqemu -p 9050:9050 \
            ghcr.io/goccy/bigquery-emulator:latest@sha256:f4e428d265a93dc5ce36c294e1c584c7c9b384117d47ab8ddbb63d8d50b7f393 \
            --project=tripl-test --dataset=wh

      - name: Wait for the warehouses
        # Bounded and explicit. If a warehouse never comes up, this step fails HERE
        # with a clear message, instead of letting the suite skip its way to green.
        run: |
          for i in $(seq 1 60); do
            # Every probe AUTHENTICATES and runs a real query. Liveness is not
            # readiness: a raw TCP connect to Postgres, and ClickHouse's /ping,
            # both answer happily on a server that will then reject every login.
            # That is not hypothetical — the ClickHouse image disables network
            # access for `default` unless credentials are set, so /ping said "ok"
            # while the suite died on `code: 194 Authentication failed`. A probe
            # that can pass while the thing it guards is unusable is not a probe.
            pg=$(uv run python -c "import psycopg; psycopg.connect(host='localhost', port=5432, dbname='tripl_conformance', user='tripl', password='tripl', connect_timeout=3).execute('SELECT 1')" >/dev/null 2>&1 && echo ok || echo no)
            ch=$(curl -sf 'http://localhost:8123/?user=tripl&password=tripl&query=SELECT%201' >/dev/null 2>&1 && echo ok || echo no)
            bq=$(curl -sf -X POST http://localhost:9050/bigquery/v2/projects/tripl-test/queries \
                   -H 'Content-Type: application/json' \
                   -d '{"query":"SELECT 1 AS x","useLegacySql":false}' >/dev/null 2>&1 && echo ok || echo no)
            echo "attempt $i: postgres=$pg clickhouse=$ch bigquery-emulator=$bq"
            if [ "$pg" = ok ] && [ "$ch" = ok ] && [ "$bq" = ok ]; then exit 0; fi
            sleep 2
          done
          echo "::error::a conformance warehouse never became reachable"
          docker logs bqemu 2>&1 | tail -50 || true
          exit 1

      - name: Conformance gates
        env:
          # Turns "warehouse unreachable" from a graceful local SKIP into a hard CI
          # FAILURE. A conformance gate that skips reports green while testing
          # nothing, which is worse than having no gate at all.
          TRIPL_CONFORMANCE_REQUIRED: "1"
          TRIPL_CONF_PG_HOST: localhost
          TRIPL_CONF_PG_PORT: "5432"
          TRIPL_CONF_PG_DB: tripl_conformance
          TRIPL_CONF_PG_USER: tripl
          TRIPL_CONF_PG_PASSWORD: tripl
          TRIPL_CONF_CH_HOST: localhost
          TRIPL_CONF_CH_PORT: "8123"
          TRIPL_CONF_CH_DB: tripl_conformance
          TRIPL_CONF_CH_USER: tripl
          TRIPL_CONF_CH_PASSWORD: tripl
          TRIPL_CONF_BQ_EMULATOR_URL: http://localhost:9050
          TRIPL_CONF_BQ_PROJECT: tripl-test
        run: |
          uv run pytest -q -m "conformance and not bigquery_value and not bigquery_pipeline and not databricks_value and not snowflake_value and not redshift_value" \
            --junitxml=conformance.xml \
            src/tripl/tests/conformance

      - name: Prove the conformance gates actually ran
        # The belt to TRIPL_CONFORMANCE_REQUIRED's braces. A broken container, a
        # mis-typed marker or a collection error would otherwise turn this whole job
        # into a no-op that reports green. Zero tests run, or any test skipped, is a
        # failure here — the gate is only a gate if it is proven to have executed.
        if: always()
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("conformance.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"::error::no conformance JUnit report: {exc}. The gates did not run.")
          suites = root.iter("testsuite")
          tests = errors = failures = skipped = 0
          for suite in suites:
              tests += int(suite.get("tests", 0))
              errors += int(suite.get("errors", 0))
              failures += int(suite.get("failures", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"conformance: {tests} collected, {failures} failed, {errors} errored, {skipped} skipped")
          if tests == 0:
              sys.exit("::error::0 conformance tests ran. A gate that collects nothing is a no-op reporting green.")
          if skipped:
              sys.exit(f"::error::{skipped} conformance test(s) SKIPPED in CI. A warehouse was unreachable; the gate tested nothing.")
          if failures or errors:
              sys.exit(f"::error::{failures} failed / {errors} errored conformance test(s).")
          PY

      - name: Emulator logs (on failure)
        if: failure()
        run: docker logs bqemu 2>&1 | tail -100 || true

  # The search ranking had NO executable coverage at all. The backend suite runs on
  # in-memory SQLite, and search keeps a Python fallback (`_search_query.sqlite_search`)
  # for exactly that reason — so `postgres_lexical_search`'s ts_rank_cd/trigram/boost
  # arithmetic, `merge_results`, and the `tripl_search` text-search configuration were
  # executed by nothing, and any weight in them could be changed without a single test
  # noticing. This job ranks a fixed corpus with the real SQL on a real PostgreSQL.
  #
  # NO case is xfailed today. The harness and the four ranking fixes landed together in
  # one commit, so the "delete an xfail to prove the fix" workflow the case table
  # describes has never actually been exercised here — every case is expected to PASS.
  # The xfail counting in the post-check below stays because RelevanceCase still carries
  # the field for the next measured fault (write the case first, fix it second, delete
  # the marker as the proof), and because pytest reports an xfail as a skip in the JUnit
  # XML — so the check has to tell the two apart before it can trust a skip count.
  greenplum:
    # The PostgreSQL gates, executed again on Greenplum through GreenplumAdapter.
    # Greenplum 6 is PostgreSQL 9.4 and Greenplum 7 is PostgreSQL 12, so both
    # lack date_bin and 'Infinity'::numeric: these are what prove the dialect
    # seams of PostgresAdapter hold on a real MPP server. The pipeline gate is not
    # run here — it also keeps tripl's own schema in this database, and that
    # schema is PostgreSQL's, not a warehouse's.
    name: Warehouse conformance (Greenplum ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # woblerr/greenplum: single-node coordinator + segments, multi-arch.
          # Pinned by digest, like every other conformance warehouse.
          - version: "6.27.1"
            image: woblerr/greenplum:6.27.1@sha256:f27652e7ecd5bdf21d4d10b54889e91abf37c7a24859ed8043d2782b3216a60e
          - version: "7.1.0"
            image: woblerr/greenplum:7.1.0@sha256:3b3a54fe3784e4031f22a143bb8e4f630d35eacbd51b2bdb04dd786c9eab7784
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Start Greenplum
        # Not a service container: the image initialises the cluster and then
        # RESTARTS it, so a health check passes once and the server goes away
        # again. The wait below asks for consecutive successful logins instead.
        run: |
          docker run -d --name greenplum -p 5432:5432 \
            -e GREENPLUM_PASSWORD=tripl -e GREENPLUM_DATABASE_NAME=tripl_conformance \
            "${{ matrix.image }}"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Wait for Greenplum
        run: |
          streak=0
          for i in $(seq 1 120); do
            if uv run python -c "import psycopg; psycopg.connect(host='localhost', port=5432, dbname='tripl_conformance', user='gpadmin', password='tripl', connect_timeout=3).execute('SELECT 1')" >/dev/null 2>&1; then
              streak=$((streak + 1))
            else
              streak=0
            fi
            echo "attempt $i: consecutive logins=$streak"
            if [ "$streak" -ge 3 ]; then exit 0; fi
            sleep 3
          done
          echo "::error::Greenplum never became reachable"
          docker logs greenplum 2>&1 | tail -50 || true
          exit 1

      - name: Conformance gates on Greenplum
        env:
          TRIPL_CONFORMANCE_REQUIRED: "1"
          TRIPL_CONF_PG_ENGINE: greenplum
          TRIPL_CONF_PG_HOST: localhost
          TRIPL_CONF_PG_PORT: "5432"
          TRIPL_CONF_PG_DB: tripl_conformance
          TRIPL_CONF_PG_USER: gpadmin
          TRIPL_CONF_PG_PASSWORD: tripl
        # The deselected test cuts a sample at "the last inserted row", which a
        # single heap has and an MPP scan does not; it skips itself here too.
        run: |
          uv run pytest -q --junitxml=greenplum-conformance.xml \
            --deselect src/tripl/tests/conformance/test_postgres_field_contracts_conformance.py::test_a_violation_past_the_sampling_limit_is_invisible_to_the_fallback \
            src/tripl/tests/conformance/test_postgres_conformance.py \
            src/tripl/tests/conformance/test_postgres_field_contracts_conformance.py

      - name: Prove the Greenplum gates actually ran
        if: always()
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("greenplum-conformance.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"::error::no Greenplum JUnit report: {exc}. The gates did not run.")
          tests = errors = failures = skipped = 0
          for suite in root.iter("testsuite"):
              tests += int(suite.get("tests", 0))
              errors += int(suite.get("errors", 0))
              failures += int(suite.get("failures", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"Greenplum conformance: {tests} collected, {failures} failed, {errors} errored, {skipped} skipped")
          if tests == 0:
              sys.exit("::error::0 Greenplum conformance tests ran.")
          if skipped:
              sys.exit(f"::error::{skipped} Greenplum conformance test(s) skipped.")
          if failures or errors:
              sys.exit(f"::error::{failures} failed / {errors} errored Greenplum conformance test(s).")
          PY

  relevance:
    name: Search relevance harness (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # THE image the compose stack runs, and the same one the alembic round trip
        # uses — for the same reason: the harness migrates a real database to head, and
        # the baseline creates the vector extension, which stock postgres cannot
        # satisfy. Pinned by digest: a gate whose database can change underneath it is
        # not a gate.
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: tripl
          POSTGRES_PASSWORD: tripl
          # Deliberately not `tripl`: the harness drops and recreates schema `public`
          # on every run, so it must never share a database name with anything else.
          POSTGRES_DB: tripl_relevance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripl -d tripl_relevance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Wait for postgres
        # pg_isready answers happily on a server that will still reject the login, so
        # the probe authenticates and runs a real query — same reasoning as the
        # conformance and migration jobs.
        run: |
          uv run python - <<'PY'
          import sys
          import time

          import psycopg

          dsn = (
              "host=localhost port=5432 dbname=tripl_relevance "
              "user=tripl password=tripl connect_timeout=3"
          )
          for attempt in range(1, 31):
              try:
                  with psycopg.connect(dsn) as conn:
                      conn.execute("SELECT 1")
                  break
              except psycopg.OperationalError as exc:
                  print(f"attempt {attempt}: {exc}")
                  time.sleep(2)
          else:
              sys.exit("::error::postgres never accepted an authenticated connection")
          print("postgres is up and authenticated")
          PY

      - name: Relevance harness
        env:
          # Turns "no PostgreSQL" from a graceful local SKIP into a hard CI FAILURE.
          TRIPL_RELEVANCE_REQUIRED: "1"
          TRIPL_RELEVANCE_PG_HOST: localhost
          TRIPL_RELEVANCE_PG_PORT: "5432"
          TRIPL_RELEVANCE_PG_DB: tripl_relevance
          TRIPL_RELEVANCE_PG_USER: tripl
          TRIPL_RELEVANCE_PG_PASSWORD: tripl
        run: |
          uv run pytest -q -m relevance \
            --junitxml=relevance.xml \
            src/tripl/tests/relevance

      - name: Prove the harness actually ran
        # The belt to TRIPL_RELEVANCE_REQUIRED's braces, and it has to be smarter than
        # the conformance job's version: pytest reports an xfail AS a skip in the JUnit
        # XML. Today that count is 0 (no case is marked), but it must be separated out
        # anyway — the moment the next fault is written down as an xfail, a check that
        # treated it as a real skip would fail the job for the harness working exactly
        # as designed. So skips are counted by `type`: `pytest.xfail` is expected,
        # anything else is a database that never came up and a gate that tested nothing.
        if: always()
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse("relevance.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"::error::no relevance JUnit report: {exc}. The harness did not run.")
          total = xfailed = 0
          skipped: list[str] = []
          broken: list[str] = []
          for case in root.iter("testcase"):
              total += 1
              name = case.get("name") or "<unnamed>"
              for node in case.findall("skipped"):
                  if node.get("type") == "pytest.xfail":
                      xfailed += 1
                  else:
                      skipped.append(name)
              if case.find("failure") is not None or case.find("error") is not None:
                  broken.append(name)
          print(f"relevance: {total} collected, {xfailed} xfailed, "
                f"{len(skipped)} skipped, {len(broken)} failed/errored")
          if total == 0:
              sys.exit("::error::0 relevance tests ran. A gate that collects nothing is a no-op.")
          if skipped:
              sys.exit(
                  "::error::relevance test(s) SKIPPED in CI: "
                  + ", ".join(skipped)
                  + ". PostgreSQL was unreachable; the ranking SQL was not executed."
              )
          if broken:
              sys.exit("::error::relevance failures: " + ", ".join(broken))
          PY

  # Static lint and revision-graph tests cannot prove PostgreSQL accepts a
  # migration or that its downgrade leaves a replayable schema. The separate
  # migration job executes the baseline on real PostgreSQL whenever Alembic
  # changes, just as the deployment entrypoint runs `alembic upgrade head`.
  #
  # Two jobs rather than one, deliberately. The scope probe always runs and always
  # reports, so the expensive job can be gated without the "skipped but required"
  # trap: a workflow-level `paths:` filter produces NO check at all, and a PR that
  # requires it sits on "Expected — Waiting for status to be reported" forever,
  # whereas a job skipped by an `if:` reports a conclusion that branch protection
  # accepts. bigquery-value-conformance.yml gates its credentialed job the same
  # way, for the same reason.
  digest-concurrency:
    name: Alert digest flush concurrency (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Stock postgres is enough here, unlike the relevance and migration jobs:
        # this gate builds its schema from Base.metadata.create_all rather than
        # running the revision chain, so nothing asks for the vector extension.
        # Pinned by digest for the same reason as every other service in this
        # file — a gate whose database can change underneath it is not a gate.
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: tripl
          POSTGRES_PASSWORD: tripl
          POSTGRES_DB: tripl_digest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripl -d tripl_digest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      TRIPL_TEST_PG_URL: postgresql+psycopg://tripl:tripl@localhost:5432/tripl_digest
      # A gate that can silently skip itself in CI is not a gate: this turns
      # "PostgreSQL unreachable" from a skip into a failure, exactly as
      # TRIPL_CONFORMANCE_REQUIRED and TRIPL_RELEVANCE_REQUIRED do.
      TRIPL_TEST_PG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Digest concurrency gate
        # -p no:randomly: two of these assert on a thread blocking against a held
        # row lock, and they seed and drop the whole schema per test. Order is not
        # the thing under test and a shuffled run only makes a failure harder to
        # read.
        run: uv run pytest -q -m "pg_concurrency or postgres" -p no:randomly

  migration-scope:
    name: Detect alembic changes
    runs-on: ubuntu-latest
    outputs:
      alembic: ${{ steps.scope.outputs.alembic }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both sides of the PR are needed to diff it; the default shallow fetch
          # has neither.
          fetch-depth: 0

      - id: scope
        name: Decide whether the round trip must run
        env:
          # Via env, not inline `${{ }}` in the script body: the values land as
          # data instead of being pasted into the shell.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Anything that is not a pull request — a push to main, and the
          # workflow_call the release workflow makes before it publishes an image
          # — runs the round trip unconditionally. Those are the commits a deploy
          # actually migrates, so a fast PR is not what matters there.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "alembic=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT_NAME: running the alembic round trip unconditionally."
            exit 0
          fi
          merge_base=$(git merge-base "$BASE_SHA" HEAD || true)
          if [ -z "$merge_base" ]; then
            # Fail TOWARDS running. A detection bug must cost a few minutes, not
            # quietly retire the only gate that executes a migration.
            echo "alembic=true" >> "$GITHUB_OUTPUT"
            echo "::warning::no merge base with $BASE_SHA; running the round trip anyway."
            exit 0
          fi
          # The workflow and parity helper are in the filter: a PR that edits
          # this gate must run the gate it edited.
          changed=$(git diff --name-only "$merge_base" HEAD -- backend/alembic .github/workflows/ci.yml bin/compare-migration-schema.py)
          if [ -n "$changed" ]; then
            echo "alembic=true" >> "$GITHUB_OUTPUT"
            echo "migration-relevant changes:"
            echo "$changed"
          else
            echo "alembic=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing changed under backend/alembic/; skipping the round trip."
          fi

  migrations:
    name: Alembic round trip (empty -> head -> base -> head)
    needs: migration-scope
    if: needs.migration-scope.outputs.alembic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # THE image the compose stack runs (compose.yaml and compose.dev.yaml),
        # not stock postgres: the baseline creates the vector extension, which a
        # stock image cannot satisfy, so the chain would die 20 revisions in and
        # the gate would be testing the wrong database anyway. pg_trgm and
        # unaccent ship with contrib. Pinned by digest for the reason the
        # conformance warehouses are: a gate whose database can change underneath
        # it is not a gate.
        image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        env:
          POSTGRES_USER: tripl
          POSTGRES_PASSWORD: tripl
          POSTGRES_DB: tripl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripl -d tripl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      # alembic/env.py takes its URL from tripl.config.settings.database_url, so
      # DATABASE_URL is the one that matters — and it must carry the ASYNC driver,
      # because env.py builds an async_engine_from_config and psycopg's sync
      # driver would fail at connect. SYNC_DATABASE_URL is not read by migrations.
      DATABASE_URL: postgresql+asyncpg://tripl:tripl@localhost:5432/tripl
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # Same setup as the backend job above: uv reads backend/.python-version
          # itself during `uv sync`, which is where Python 3.14 comes from.

      - name: Install dependencies
        run: uv sync --extra dev

      - id: baseline
        name: Detect the single baseline revision
        run: |
          revision_count=$(find alembic/versions -maxdepth 1 -name '*.py' | wc -l)
          head=$(uv run alembic heads | awk 'NR==1 {print $1}')
          if [ "$revision_count" -eq 1 ] && [ "$head" = a1c3e5f7b9d2 ]; then
            echo "compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "compare=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the historical schema comparison applies only to the a1c3e5f7b9d2 baseline"
          fi

      - name: Wait for an EMPTY Postgres
        # pg_isready answers happily on a server that will still reject the login,
        # so the probe authenticates and runs a real query — the same reasoning as
        # the conformance job's wait step. It also asserts the database is empty:
        # a "from empty" round trip that in fact starts from someone else's schema
        # proves nothing about the first revisions.
        run: |
          uv run python - <<'PY'
          import sys
          import time

          import psycopg

          dsn = "host=localhost port=5432 dbname=tripl user=tripl password=tripl connect_timeout=3"
          for attempt in range(1, 31):
              try:
                  with psycopg.connect(dsn) as conn:
                      tables = conn.execute(
                          "SELECT table_name FROM information_schema.tables "
                          "WHERE table_schema = 'public' ORDER BY table_name"
                      ).fetchall()
                  break
              except psycopg.OperationalError as exc:
                  print(f"attempt {attempt}: {exc}")
                  time.sleep(2)
          else:
              sys.exit("::error::postgres never accepted an authenticated connection")
          if tables:
              names = ", ".join(row[0] for row in tables)
              sys.exit(f"::error::the database is not empty, it already holds: {names}")
          print("postgres is up, authenticated, and empty")
          PY

      - name: Upgrade head from empty
        # The leg every fresh install runs. From EMPTY, so the baseline (and any
        # later revisions) executes against real Postgres.
        # `alembic current` is compared to `alembic heads` because `upgrade` exits
        # 0 on a chain that did nothing at all.
        run: |
          uv run alembic upgrade head
          head=$(uv run alembic heads | awk 'NR==1 {print $1}')
          current=$(uv run alembic current | awk 'NR==1 {print $1}')
          echo "heads=$head current=$current"
          if [ -z "$head" ] || [ "$current" != "$head" ]; then
            echo "::error::after upgrade head the database is at '$current', expected '$head'"
            exit 1
          fi

      # This pins the pre-squash chain to an immutable main commit. Its final
      # schema must match the new baseline exactly, including indexes, checks,
      # enum types, functions, and extension state. The comparison is relevant
      # only while a1c3e5f7b9d2 is the sole revision; later migrations keep the
      # round-trip gate above and below without comparing to historical head.
      - uses: actions/checkout@v7
        if: steps.baseline.outputs.compare == 'true'
        with:
          ref: 19eea9a9a433a05c97a03e371f06b4bb16759fdc
          path: legacy

      - name: Upgrade the pre-squash chain in a second database
        if: steps.baseline.outputs.compare == 'true'
        working-directory: legacy/backend
        env:
          DATABASE_URL: postgresql+asyncpg://tripl:tripl@localhost:5432/tripl_legacy
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U tripl tripl_legacy
          uv sync --extra dev
          uv run alembic upgrade head
          head=$(uv run alembic heads | awk 'NR==1 {print $1}')
          current=$(uv run alembic current | awk 'NR==1 {print $1}')
          if [ "$head" != a1c3e5f7b9d2 ] || [ "$current" != "$head" ]; then
            echo "::error::pre-squash chain ended at '$current', expected a1c3e5f7b9d2"
            exit 1
          fi

      - name: Compare pre-squash and baseline PostgreSQL schemas
        if: steps.baseline.outputs.compare == 'true'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U tripl --schema-only --no-owner --no-privileges --restrict-key=triplcischemacompare2026 --exclude-table=public.alembic_version tripl_legacy > "$RUNNER_TEMP/legacy-schema.sql"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U tripl --schema-only --no-owner --no-privileges --restrict-key=triplcischemacompare2026 --exclude-table=public.alembic_version tripl > "$RUNNER_TEMP/baseline-schema.sql"
          # pg_dump can print the same varchar[] CHECK ANY expression with a
          # whole-array text[] cast or per-element text casts after restore.
          # The helper normalizes only that exact expression; all other DDL
          # and every constraint value/name still receive a strict comparison.
          if ! uv run python ../bin/compare-migration-schema.py "$RUNNER_TEMP/legacy-schema.sql" "$RUNNER_TEMP/baseline-schema.sql"; then
            echo "::error::baseline schema differs from the pre-squash migration chain"
            exit 1
          fi
          expected='00000000-0000-0000-0000-00000000d0f1|default|Default organization'
          for database in tripl_legacy tripl; do
            actual=$(docker exec "$POSTGRES_CONTAINER" psql -U tripl -d "$database" -Atc "SELECT id, slug, name FROM organizations ORDER BY id")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$database default organization seed differs from the pre-squash chain"
              exit 1
            fi
          done

      - name: Downgrade to base and prove nothing is left behind
        # Unwind the current chain (the baseline alone, until later revisions).
        # An apparently successful downgrade can leave tables or enum types
        # behind, so both the revision marker and physical schema are checked.
        #
        # `alembic current` must print NOTHING at base; it exits 0 either way.
        # The two SQL checks catch the downgrade that drops its table and keeps
        # its enum type, which no version marker would ever notice.
        #
        # The leftover queries go through psycopg rather than the `psql` CLI, for
        # the same reason the wait step above does: the client binary is not
        # guaranteed on the runner, and psycopg is already a dependency.
        run: |
          uv run alembic downgrade base
          current=$(uv run alembic current | awk 'NR==1 {print $1}')
          if [ -n "$current" ]; then
            echo "::error::after downgrade base the database is still at '$current'"
            exit 1
          fi
          uv run python - <<'PY'
          import sys

          import psycopg

          dsn = "host=localhost port=5432 dbname=tripl user=tripl password=tripl connect_timeout=3"
          with psycopg.connect(dsn) as conn:
              tables = conn.execute(
                  "SELECT table_name FROM information_schema.tables "
                  "WHERE table_schema = 'public' AND table_name <> 'alembic_version' "
                  "ORDER BY table_name"
              ).fetchall()
              # Enum types owned by an extension (pgvector) are not ours to drop.
              enums = conn.execute(
                  "SELECT t.typname FROM pg_type t "
                  "JOIN pg_namespace n ON n.oid = t.typnamespace "
                  "WHERE n.nspname = 'public' AND t.typtype = 'e' "
                  "AND NOT EXISTS ("
                  "  SELECT 1 FROM pg_depend d WHERE d.objid = t.oid AND d.deptype = 'e'"
                  ") ORDER BY t.typname"
              ).fetchall()
          if tables:
              sys.exit("::error::downgrade base left these tables behind: "
                       + ", ".join(row[0] for row in tables))
          if enums:
              sys.exit("::error::downgrade base left these enum types behind: "
                       + ", ".join(row[0] for row in enums))
          print("downgraded to base with no leftover tables or enum types")
          PY

      - name: Upgrade head again
        # The half of the round trip that catches a downgrade which "succeeded"
        # into a state the chain can no longer be replayed over — a dropped column
        # that comes back with the wrong type, a type left in place that CREATE
        # TYPE then trips over, an index name that only exists the first time.
        run: |
          uv run alembic upgrade head
          head=$(uv run alembic heads | awk 'NR==1 {print $1}')
          current=$(uv run alembic current | awk 'NR==1 {print $1}')
          echo "heads=$head current=$current"
          if [ -z "$head" ] || [ "$current" != "$head" ]; then
            echo "::error::after the re-upgrade the database is at '$current', expected '$head'"
            exit 1
          fi

  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Bun installs the dependencies and runs the scripts (vite, vitest,
      # openapi-typescript) on its own runtime; the version comes from
      # frontend/package.json "packageManager".
      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: frontend/package.json

      # Node runs one step only: the project lint-rule tests. Oxlint's
      # RuleTester refuses any runtime but Node.
      - name: Install Node (lint-rule tests)
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version

      - name: Install dependencies
        run: bun ci

      # backend/openapi.json is gated by test_openapi_contract.py, whose failure
      # message tells you to run `bun run gen:api` — but nothing checked that anyone
      # did. A PR could refresh the snapshot and leave src/types/api.gen.ts
      # stale, and `tsc -b` only notices when the frontend happens to reference
      # a field that changed. Regenerate and require the tree to be unchanged.
      - name: API types match backend/openapi.json
        run: |
          bun run gen:api
          git diff --exit-code -- src/types/api.gen.ts

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      # The JavaScript a first page load fetches (entry + modulepreloads) has a
      # ratcheting byte budget, and chunks split out to load on demand must stay
      # off that path. Budgets live in scripts/check-bundle-budget.mjs.
      - name: Bundle budget
        run: bun run check:bundle

      # Same test set as `bun run test`, plus v8 coverage. The thresholds in
      # vite.config.ts fail this step when coverage drops below them; they are
      # 0 until the first measured baseline is recorded (CONTRIBUTING.md,
      # "Coverage"), so for now this step reports and does not gate.
      - name: Test (with coverage)
        run: bun run test:coverage

      # The summary is uploaded even from a red run, so a threshold failure can
      # be compared against the numbers without re-running locally.
      - name: Upload coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-summary
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  # A real browser against the dev stack: the whole pipeline a
  # visitor drives, worker and synthetic warehouse included. The stack is the
  # one `compose.dev.yaml` gives a developer, with sign-up rate limits off so
  # every test can sign up an account of its own.
  e2e:
    name: E2E (Playwright against the dev stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start the dev stack
        env:
          RATE_LIMIT_ENABLED: "false"
        run: |
          docker compose -f compose.dev.yaml up --build -d api celery-worker celery-beat frontend
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:5173/api/v1/auth/status && exit 0
            sleep 5
          done
          docker compose -f compose.dev.yaml ps
          exit 1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: bun ci

      - name: Install Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Run the e2e tests
        working-directory: frontend
        env:
          # The `update-snapshots` label: write the missing and changed
          # screenshot baselines (uploaded below) instead of failing on them.
          E2E_UPDATE_SNAPSHOTS: ${{ contains(github.event.pull_request.labels.*.name, 'update-snapshots') }}
        run: bun run test:e2e

      - name: Upload the screenshot baselines
        if: ${{ always() && contains(github.event.pull_request.labels.*.name, 'update-snapshots') }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-snapshots
          path: frontend/e2e/*-snapshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose -f compose.dev.yaml logs --no-color --tail 300 api celery-worker frontend

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  image-scope:
    name: Detect image-definition changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Both sides of the PR are needed to diff it; the default shallow fetch
          # has neither.
          fetch-depth: 0

      - id: scope
        name: Decide whether the images must be built
        env:
          # Via env, not inline `${{ }}` in the script body: the values land as
          # data instead of being pasted into the shell.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT_NAME: building the images unconditionally."
            exit 0
          fi
          merge_base=$(git merge-base "$BASE_SHA" HEAD || true)
          if [ -z "$merge_base" ]; then
            # Fail TOWARDS building, same as migration-scope: a detection bug
            # must cost minutes, not retire the only gate that compiles an image.
            echo "images=true" >> "$GITHUB_OUTPUT"
            echo "::warning::no merge base with $BASE_SHA; building the images anyway."
            exit 0
          fi
          # Build DEFINITIONS only. Application source is already gated by the
          # backend and frontend jobs, and the root Dockerfile COPYs frontend/
          # and backend/src wholesale — probing those would fire on nearly every
          # PR and turn this into an always-on cost. A source deletion that
          # breaks a COPY is still caught by the unconditional run on push to
          # main, hours before a tag rather than during the release.
          changed=$(git diff --name-only "$merge_base" HEAD -- \
            Dockerfile .dockerignore mcp-server/Dockerfile \
            backend/pyproject.toml backend/uv.lock backend/.python-version \
            frontend/package.json frontend/bun.lock frontend/bunfig.toml \
            cli/pyproject.toml mcp-server/pyproject.toml mcp-server/uv.lock \
            backend/scripts/third_party_licenses.py \
            frontend/scripts/third-party-licenses.mjs \
            .github/workflows/ci.yml)
          if [ -n "$changed" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            echo "image-relevant changes:"
            echo "$changed"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no image-definition changes; skipping the build."
          fi

  images:
    name: Build the published images (no push)
    needs: image-scope
    if: needs.image-scope.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Until this job existed, nothing built an image before a v* tag did:
      # release.yml was the FIRST place the Dockerfiles ran, so a break in them,
      # in .dockerignore, or in a lockfile surfaced while cutting a release,
      # after every other gate had gone green. amd64 only and push: false — this
      # gate is about whether the images still build, not about publishing them;
      # release.yml keeps the arm64 leg and the registry credentials.
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: tripl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The image must carry its third-party notices, and they must have found
      # the license files: an empty table means the generator broke quietly.
      # psycopg is checked by name because its LGPL is the one notice with a
      # duty attached.
      - name: Check the app image's license notices
        run: |
          docker run --rm --entrypoint sh tripl:ci -c '
            set -e
            test -s /app/licenses/README.md
            test -s /app/licenses/os-packages.tsv
            test -s /app/licenses/frontend/index.json
            ls /app/licenses/python/psycopg-*/ | grep -qi license
            grep -q "## Web application" /app/licenses/README.md
            echo "$(ls /app/licenses/python | wc -l) Python, $(grep -c "\"name\"" /app/licenses/frontend/index.json) frontend package notices"
          '

      - name: Build the MCP image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./mcp-server/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
