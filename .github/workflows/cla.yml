name: CLA

# Every pull request author signs the Contributor License Agreement (CLA.md)
# once, by commenting on the pull request. Signatures are kept in
# signatures/cla.json on the unprotected `cla-signatures` branch, never on
# main. The maintainer and bots are allowlisted, and so is `claude`: the
# account GitHub maps the Co-Authored-By trailer of AI-assisted commits to.
#
# pull_request_target runs in the base repository's context so it can comment
# and set the status on forks' pull requests. It never checks out or runs the
# pull request's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A signature binds the CLA.md text as it was when signed. v1.1 replaced
          # v1.0 in place because nobody had signed yet; a substantive change
          # after the first signature needs a new path here (signatures/cla-v2.json),
          # so every contributor signs the new text.
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/tripl-io/tripl/blob/main/CLA.md
          branch: cla-signatures
          allowlist: vladenisov,claude,dependabot[bot],github-actions[bot],copilot*,*[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for the contribution! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/tripl-io/tripl/blob/main/CLA.md)
            and sign it by commenting on this pull request with the sentence below.
            You sign once; it covers your future contributions too.
