name: Publish tripl-mcp

# Publishes the standalone MCP client package to PyPI.
#
# Its own tag, `mcp-vX.Y.Z`, beside `v*` (release.yml, the service's images)
# and `cli-v*` (publish-cli.yml, the `tripl` CLI this package depends on). All
# three carry one version, which bin/release.sh writes; it pushes this tag
# last, once `tripl` X.Y.Z is on PyPI.
#
# Authentication is Trusted Publishing (OIDC) — there is no API token stored
# anywhere. PyPI verifies the workflow identity (repo + workflow file +
# environment) against a publisher configured on the project, and mints a
# short-lived credential for that upload only. A leaked repo secret cannot
# publish, because there is no secret.
on:
  push:
    tags:
      - "mcp-v*"

# Least privilege: only what each job actually needs. `contents: read` is the
# documented minimum for actions/checkout — it is redundant on a public repo,
# where the clone succeeds anonymously, but it is what keeps this workflow
# working if the repo is ever made private, and it matches docs.yml.
#
# Deliberately NOT `actions: write` (Copilot review, PR #75): upload-artifact
# writes through the Actions artifact service using ACTIONS_RUNTIME_TOKEN, which
# the runner injects independently of GITHUB_TOKEN, so no artifact scope is
# involved. Granting a write scope nothing uses is the opposite of the point.
permissions:
  contents: read

jobs:
  build:
    name: Build and gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # Repeated from ci.yml's `mcp` job on purpose: a release must never be the
      # first time these run, and a tag can be pushed on a commit that never
      # went through CI. --locked matches ci.yml: it FAILS when
      # uv.lock no longer describes pyproject.toml, whereas --frozen would
      # quietly use the stale lock and gate on a dependency set the wheel
      # below does not describe.
      - name: Lint, type-check and test
        working-directory: mcp-server
        run: |
          uv run --locked --group dev ruff check
          uv run --locked --group dev ruff format --check
          uv run --locked --group dev mypy src
          uv run --locked --group dev pytest -q

      # A tag that disagrees with pyproject silently publishes the wrong
      # version and the number can never be reused on PyPI. Fail instead.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        working-directory: mcp-server
        run: |
          packaged=$(uv version --short)
          tagged=${GITHUB_REF_NAME#mcp-v}
          echo "packaged=$packaged tagged=$tagged"
          if [ "$packaged" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $packaged"
            exit 1
          fi

      - name: Build sdist and wheel
        working-directory: mcp-server
        run: uv build

      # Installing the built wheel into a clean environment is the check that
      # catches what a lockfile hides: uv.lock pins a working dependency set,
      # but consumers get only the declared constraints. An unbounded `mcp`
      # floor once resolved to 2.0, where mcp.server.fastmcp no longer exists,
      # and the console script died on import.
      - name: Smoke-test the wheel in a clean environment
        working-directory: mcp-server
        run: |
          uv venv /tmp/smoke --python 3.12
          # Deliberately NO --find-links: this must install exactly what a user
          # gets from the index, dependencies included. Pointing it at the local
          # cli/dist would let `tripl` resolve from a directory no consumer has,
          # turning the one gate that catches what a lockfile hides into a gate
          # that hides it too.
          #
          # The `tripl` range this wheel declares (mcp-server/pyproject.toml)
          # resolves here exactly as it will for a user. When the `tripl` it
          # needs is not on PyPI yet, this step FAILS — the correct outcome,
          # because a released wheel with an unresolvable dependency is broken
          # for everyone who installs it. Publish `tripl` first (bin/release.sh
          # does); do not silence this by re-adding a local link.
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/tripl-mcp --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: mcp-server/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name is part of what PyPI verifies for a trusted
    # publisher, and it is where a manual approval gate can be added later.
    environment: pypi
    permissions:
      # Job-level permissions REPLACE the workflow-level block rather than
      # extending it, so contents is restated here even though this job only
      # downloads an artifact.
      contents: read
      id-token: write # mint the OIDC token PyPI exchanges for upload rights
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Named explicitly rather than left to the action's default, which is a
          # needless thing to gamble a publish on.
          repository-url: https://upload.pypi.org/legacy/
