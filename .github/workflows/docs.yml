name: Docs

# Build the Docusaurus site in website/ and publish it to GitHub Pages
# (https://docs.tripl.io/). Runs when docs sources change on main,
# on release tags, and on manual dispatch. A pull request that touches them
# builds the site without publishing it. One-time setup: in repo Settings ->
# Pages, set Source = "GitHub Actions" and the custom domain docs.tripl.io
# (DNS: CNAME docs -> tripl-io.github.io, not proxied). website/static/CNAME
# carries the same name; the old tripl-io.github.io/tripl/ URLs redirect.
on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
# A pull request's build-only run queues on its own group, never behind a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Bun installs and builds; the version comes from website/package.json
      # "packageManager". Dependency lifecycle scripts do not run (none is
      # listed in "trustedDependencies"), as the static build needs none.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: website/package.json
      - name: Install
        run: bun ci
      - name: Build
        run: bun --bun run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
