name: Docs

# Build the Docusaurus site in website/ and publish it to GitHub Pages
# (https://vladenisov.github.io/tripl/). Runs when docs sources change on main,
# on release tags, and on manual dispatch. One-time setup: in repo Settings ->
# Pages, set Source = "GitHub Actions".
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable corepack (pnpm from packageManager field)
        run: corepack enable
      - name: Install (no postinstall scripts needed for a static build)
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Build
        run: corepack pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
