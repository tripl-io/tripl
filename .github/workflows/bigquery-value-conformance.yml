name: BigQuery release conformance

on:
  # Never expose cloud credentials to pull-request code. The emulator analysis
  # gate in ci.yml remains the required BigQuery check on every PR; real values
  # execute only for the version tags used by the release workflow, so regular
  # commits do not consume BigQuery quota.
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: bigquery-value-conformance
  cancel-in-progress: false

jobs:
  credentials:
    name: Validate credential configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    env:
      BQ_VALUE_CONFORMANCE_ENABLED: ${{ vars.BQ_VALUE_CONFORMANCE_ENABLED }}
      BQ_SERVICE_ACCOUNT_JSON: ${{ secrets.BQ_SERVICE_ACCOUNT_JSON }}
      BQ_PROJECT: ${{ vars.BQ_PROJECT }}
    steps:
      - id: probe
        name: Detect configured BigQuery identity
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BigQuery conformance runs only for stable vX.Y.Z tags; skipping $GITHUB_REF_NAME."
          elif [ "$BQ_VALUE_CONFORMANCE_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BigQuery value conformance is intentionally disabled."
          elif [ -n "$BQ_SERVICE_ACCOUNT_JSON" ] && [ -n "$BQ_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "BigQuery value conformance is enabled."
          else
            echo "::error::BQ_VALUE_CONFORMANCE_ENABLED=true requires BQ_SERVICE_ACCOUNT_JSON and BQ_PROJECT."
            exit 1
          fi

  values:
    name: Real BigQuery values and worker pipeline
    needs: credentials
    if: needs.credentials.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: tripl
          POSTGRES_PASSWORD: tripl
          POSTGRES_DB: tripl_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripl -d tripl_conformance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Execute real BigQuery value contract
        env:
          # Step-scoped: the credential never reaches checkout, dependency setup,
          # caches, artifacts, or a file on disk.
          TRIPL_CONF_BQ_CREDENTIALS_JSON: ${{ secrets.BQ_SERVICE_ACCOUNT_JSON }}
          TRIPL_CONF_BQ_REAL_PROJECT: ${{ vars.BQ_PROJECT }}
          TRIPL_CONF_BQ_REAL_LOCATION: ${{ vars.BQ_LOCATION }}
          TRIPL_BQ_VALUE_REQUIRED: "1"
          TRIPL_BQ_PIPELINE_REQUIRED: "1"
          TRIPL_CONFORMANCE_REQUIRED: "1"
          TRIPL_CONF_PG_HOST: localhost
          TRIPL_CONF_PG_PORT: "5432"
          TRIPL_CONF_PG_DB: tripl_conformance
          TRIPL_CONF_PG_USER: tripl
          TRIPL_CONF_PG_PASSWORD: tripl
        run: |
          uv run pytest -q \
            --junitxml=bigquery-value-conformance.xml \
            src/tripl/tests/conformance/test_bigquery_value_conformance.py \
            src/tripl/tests/conformance/test_bigquery_pipeline_value_conformance.py

      - name: Prove the credentialed gate ran without skips
        if: always()
        run: python3 ../bin/check-junit.py bigquery-value-conformance.xml "BigQuery conformance"
