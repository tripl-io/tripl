version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Dependabot's bun ecosystem reads bun.lock (the npm one would look for a
  # package-lock.json that no longer exists).
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # jsdom 30.1 breaks reopening a Radix menu by keyboard in a later test of
      # the same file (the trigger ignores Enter), so frontend/package.json pins
      # 30.0.1. Drop this once a newer jsdom passes the menu tests.
      - dependency-name: jsdom
        versions: ["30.1.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
