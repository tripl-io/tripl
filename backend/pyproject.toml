[project]
# Distribution `tripl-server`, import package `tripl` (src/tripl/) — the two
# differ ON PURPOSE and this is not a typo to "fix". The reserved PyPI name
# `tripl` belongs to the operator CLI in cli/, so `pip install tripl` gives a
# user that tool rather than a 400 MB service stack. Renaming the import package
# to match would have rewritten every module in the repo to buy nothing: this
# distribution is never published, so its name is internal and nobody outside
# the repo ever types it.
name = "tripl-server"
version = "0.3.0"
description = "Analytics tracking plan service"
requires-python = ">=3.14"
# The service itself is copyleft: running a modified tripl as a network service
# obliges you to publish those modifications. The client packages (mcp-server)
# stay permissive so integrating with tripl never pulls this into your code.
license = "AGPL-3.0-or-later"
authors = [{ name = "Vladislav Denisov" }]
# Not published to PyPI — the service ships as a container image (see
# bin/release.sh). The marker makes an accidental `uv publish` from this
# directory fail loudly instead of pushing a 400 MB server stack to the index.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pydantic-settings>=2.15.0",
    "celery>=5.6.3",
    "clickhouse-connect>=1.7.1",
    "cryptography>=49.0.0",
    "psycopg[binary]>=3.3.4",
    "google-cloud-bigquery>=3.43.0",
    "google-cloud-storage>=3.13.1",
    "python-multipart>=0.0.32",
    "statsmodels>=0.14.6",
    "redis[hiredis]>=8.1.0",
    "brotli-asgi>=1.6",
    "prometheus-client>=0.26.0",
    "email-validator>=2.3.0",
    "numpy>=2.5.2",
    # Docs catalog frontmatter (F22). Already in the lock through uvicorn[standard];
    # declared because tripl imports it directly.
    "pyyaml>=6.0.2",
    # OIDC single sign-on (F20): id_token signature and claim checks against the
    # identity provider's JWKS.
    "pyjwt[crypto]>=2.10",
    # SSO domain verification (F20): the DNS TXT lookup. Already in the lock
    # through email-validator; declared because tripl imports it directly.
    "dnspython>=2.8.0",
    "holidays>=0.105",
]

[project.scripts]
# The operator's shell tool for the platform-admin flag (F20 PR14): how a hosted
# operator makes the first platform admin. Not the `tripl` CLI (cli/).
tripl-admin = "tripl.admin_cli:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.38.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0,<1",
    "opentelemetry-instrumentation-celery>=0.59b0,<1",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "aiosqlite>=0.22.1",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.0.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 1.x ignores a custom event_loop fixture; pin loop scope to the
# whole session so every test/fixture shares one loop. This keeps the in-memory
# sqlite StaticPool connection stable across tests (no per-loop reconnect churn /
# ResourceWarnings) and mirrors the old session-scoped event_loop behavior.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["src/tripl/tests"]
markers = [
    # Executable warehouse conformance gates (src/tripl/tests/conformance/). They
    # need a real PostgreSQL, a real ClickHouse and the BigQuery emulator, so they
    # SKIP when those are unreachable — run `pytest -m "not conformance"` to drop
    # them from a local run entirely. CI runs them with TRIPL_CONFORMANCE_REQUIRED=1,
    # which turns "warehouse unreachable" from a skip into a failure.
    "conformance: executes/analyzes generated SQL against a real warehouse",
    # Needs a real PostgreSQL (TRIPL_TEST_PG_URL); skips without one, fails when
    # TRIPL_TEST_PG_REQUIRED=1. CI runs these in the PostgreSQL lane.
    "postgres: runs against a real PostgreSQL over the production driver",
    # Real BigQuery values need a credentialed, trusted-release job. The ordinary
    # conformance job excludes this marker and keeps using the emulator analyzer.
    "bigquery_value: executes value assertions against real BigQuery",
    "bigquery_pipeline: executes the full worker pipeline against real BigQuery",
    # The search relevance harness (src/tripl/tests/relevance/). The suite runs on
    # SQLite, so the PRODUCTION ranking SQL — ts_rank_cd, the trigram/boost tiers,
    # merge_results, and the tripl_search text-search configuration — is executed
    # by nothing else. It needs a real PostgreSQL (the pgvector image, because the
    # revision chain creates the vector extension), so it SKIPS when none is
    # reachable. CI runs it with TRIPL_RELEVANCE_REQUIRED=1, which turns that skip
    # into a failure. Every case is expected to PASS: the harness and the four
    # ranking fixes landed in one commit, so no case has ever carried the
    # xfail(strict=True) marker RelevanceCase still supports for the next measured
    # fault. See CONTRIBUTING.md, "Search relevance harness".
    "relevance: ranks a fixed corpus with the real PostgreSQL search SQL",
    # The alert-digest flush concurrency gate
    # (src/tripl/tests/test_alert_digest_concurrency_pg.py). The rest of the
    # suite runs on SQLite, where BOTH guards it covers are silent no-ops:
    # `SELECT ... FOR UPDATE` emits nothing and `_try_acquire_advisory_lock`
    # returns "acquired" without asking the database. So the flusher's
    # concurrency safety is executed by nothing else. Needs any empty
    # PostgreSQL via TRIPL_TEST_PG_URL and SKIPS without one; CI runs it with
    # TRIPL_TEST_PG_REQUIRED=1, which turns that skip into a failure.
    "pg_concurrency: exercises the digest flush guards against a real PostgreSQL",
]
filterwarnings = [
    # Third-party deprecations we don't control — keep the run summary clean
    # without hiding warnings raised by our own code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The 'u' type code is deprecated",
    # statsmodels MSTL on the short synthetic series in the seasonality test.
    "ignore:A period\\(s\\) is larger than half the length of time series",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
# alembic/versions is deliberately NOT excluded. It used to be, and that is
# exactly how PR #64 swept ~1,600 lines of formatting-only churn into 12
# historical migrations: an exclude in config is overridden the moment someone
# names the path explicitly (`ruff format src/tripl alembic/versions`), so the
# directory had never been formatted and every file rewrote at once. Linting it
# like everything else removes the trap — there is no longer a second, dirtier
# state for an explicit path to discover. `script.py.mako` generates migrations
# that already satisfy these rules.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/tripl"]
exclude = ["src/tripl/tests/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "statsmodels.*", "google.cloud.*", "opentelemetry.*"]
ignore_missing_imports = true

# Coverage for `pytest --cov=tripl` (CI runs it; see CONTRIBUTING.md, "Coverage").
# Measured over the installed package, so the test modules under
# src/tripl/tests are omitted explicitly; alembic/ sits outside the package and
# is listed only so a future `--cov=.` cannot pull the migrations in.
[tool.coverage.run]
source = ["tripl"]
omit = ["*/tripl/tests/*", "*/alembic/*"]
# sys.monitoring (PEP 669) instead of a settrace tracer: the suite ran in ~22
# minutes on CI under the C tracer and ~8.5 under sysmon, against ~6.5 with no
# coverage at all, for the same total (60512 statements, 3896 vs 3897 missed).
# sysmon sees every frame, greenlets included, so SQLAlchemy's greenlet bridge
# (the async request path's ORM calls) needs no `concurrency = greenlet`, which
# exists only to hand settrace across greenlet switches.
core = "sysmon"
concurrency = ["thread"]

[tool.coverage.report]
# A ratchet: raise it when coverage rises, never lower it to get a red run
# through. pytest-cov reads it, so CI passes no --cov-fail-under of its own.
# Measured on CI on 2026-09-26: 92.4% (35934 statements, 2713 missed), rounded down.
fail_under = 92
skip_empty = true
